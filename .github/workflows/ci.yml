name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs
      - run: composer stan

  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        wp: [ '7.0', '7.1', 'nightly' ]
        db: [ 'mysql:5.7', 'mysql:8.0', 'mariadb:10.4', 'mariadb:10.11' ]
        # Full cross product is 48 jobs; keep every PHP, WP and DB covered at least
        # twice by pairing them (see exclude below).
        exclude:
          - { php: '8.2', db: 'mysql:5.7' }
          - { php: '8.2', db: 'mariadb:10.4' }
          - { php: '8.3', db: 'mysql:8.0' }
          - { php: '8.3', db: 'mariadb:10.11' }
          - { php: '8.4', db: 'mysql:5.7' }
          - { php: '8.4', db: 'mariadb:10.4' }
          - { php: '8.1', db: 'mysql:8.0' }
          - { php: '8.1', db: 'mariadb:10.11' }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
      - run: sudo apt-get install -y subversion
      - run: composer install --no-interaction --prefer-dist
      - run: bin/install-wp-tests.sh wp_test root root 127.0.0.1 ${{ matrix.wp }}
      - run: vendor/bin/phpunit

  differential:
    name: Differential baseline (ACF vs ACF, SCF)
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: composer
      - run: sudo apt-get install -y subversion
      - run: composer install --no-interaction --prefer-dist
      - run: bin/install-wp-tests.sh wp_test root root 127.0.0.1 7.0
      - name: Install Secure Custom Fields (free ACF fork incl. the repeater)
        run: bin/install-scf.sh
      - name: ACF vs ACF baseline on the bench dataset
        run: vendor/bin/phpunit -c phpunit-acf.xml.dist

  bench-spike:
    name: Spike benchmark (10k posts, ACF meta vs NF pivot)
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: composer
      - run: sudo apt-get install -y subversion
      - run: composer install --no-interaction --prefer-dist
      - run: bin/install-wp-tests.sh wp_test root root 127.0.0.1 7.0
      - name: Run the benchmark
        id: bench
        env:
          NF_BENCH_POSTS: '10000'
          NF_BENCH_OUT: ${{ runner.temp }}/spike.md
        run: |
          vendor/bin/phpunit --filter SpikeBenchmarkTest
          cat "$NF_BENCH_OUT" | tee -a "$GITHUB_STEP_SUMMARY" || true

  release-build:
    name: Release zip builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: bin/build-release.sh
      - name: Zip ships vendor/ and no dev files
        run: |
          unzip -l build/normalized-fields-*.zip | grep -q 'normalized-fields/vendor/autoload.php'
          unzip -l build/normalized-fields-*.zip | grep -q 'normalized-fields/src/Plugin.php'
          unzip -l build/normalized-fields-*.zip | grep -q 'normalized-fields/normalized-fields.php'
          ! unzip -l build/normalized-fields-*.zip | grep -qE 'normalized-fields/(tests|\.github)/'
